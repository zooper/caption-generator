<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Caption Studio</title>
    <link rel="stylesheet" href="themes.css">
    <script src="theme-loader.js"></script>
    <link rel="stylesheet" href="darkroom.css">
    <script>
        // Placeholder for SimpleWebAuthn - will be loaded by module
        window.SimpleWebAuthnBrowser = null;
    </script>
    <script type="module">
        import { startRegistration, startAuthentication } from 'https://unpkg.com/@simplewebauthn/browser@10.0.0/dist/bundle/index.js';
        window.SimpleWebAuthnBrowser = { startRegistration, startAuthentication };
        console.log('✅ SimpleWebAuthn module loaded (v10)');
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--dr-sans);
            background: var(--dr-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dr-ink);
            -webkit-font-smoothing: antialiased;
        }

        .auth-container {
            background: var(--dr-panel);
            border: 1px solid var(--dr-line);
            border-radius: var(--dr-radius);
            box-shadow: 0 30px 70px -40px #000;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            margin: 20px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--dr-ink);
            margin-bottom: 10px;
        }

        .auth-header h1 .brand-mark {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background: var(--dr-gradient);
            box-shadow: 0 3px 12px -2px rgba(var(--dr-accent-rgb), .6);
            flex-shrink: 0;
        }

        .auth-header p {
            color: var(--dr-ink-2);
            font-size: 0.95rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--dr-ink-2);
        }

        .form-group input {
            padding: 13px 14px;
            border: 1px solid var(--dr-line-2);
            border-radius: var(--dr-radius-sm);
            background: var(--dr-input);
            color: var(--dr-ink);
            font-size: 15px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .form-group input::placeholder {
            color: var(--dr-ink-4);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--dr-accent);
            box-shadow: 0 0 0 3px rgba(var(--dr-accent-rgb), .25);
        }

        .passkey-btn {
            background: var(--dr-gradient);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: var(--dr-radius-sm);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .passkey-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px -10px rgba(var(--dr-accent-rgb), .7);
        }

        .passkey-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .magic-link-btn {
            background: var(--dr-gradient);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: var(--dr-radius-sm);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }

        .magic-link-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px -10px rgba(var(--dr-accent-rgb), .7);
        }

        .magic-link-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--dr-ink-3);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--dr-line);
        }

        .divider span {
            padding: 0 10px;
            font-size: 14px;
        }

        .notification {
            padding: 13px 15px;
            border-radius: var(--dr-radius-sm);
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 0.9rem;
            display: none;
        }

        .notification.success {
            background: rgba(52, 211, 153, .12);
            color: var(--dr-ok);
            border: 1px solid rgba(52, 211, 153, .35);
        }

        .notification.error {
            background: rgba(248, 113, 113, .12);
            color: var(--dr-err);
            border: 1px solid rgba(248, 113, 113, .35);
        }

        .notification.info {
            background: rgba(var(--dr-accent-rgb), .12);
            color: var(--dr-accent-2);
            border: 1px solid rgba(var(--dr-accent-rgb), .35);
        }

        .back-link {
            text-align: center;
            margin-top: 30px;
        }

        .back-link a {
            color: var(--dr-accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, .35);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .email-sent {
            text-align: center;
            display: none;
        }

        .email-sent h2 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            color: var(--dr-ink);
            font-weight: 800;
            margin-bottom: 15px;
        }

        .email-sent p {
            color: var(--dr-ink-2);
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .email-sent strong {
            color: var(--dr-ink);
        }

        .passkey-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            margin-right: 7px;
        }

        .fallback-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: var(--dr-ink-3);
        }

        .fallback-link a {
            color: var(--dr-accent);
            text-decoration: none;
            font-weight: 500;
        }

        .fallback-link a:hover {
            text-decoration: underline;
        }

        #magicLinkSection {
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1><span class="brand-mark" aria-hidden="true"></span>AI Caption Studio</h1>
            <p id="headerText">Sign in securely</p>
        </div>

        <div class="notification" id="notification"></div>

        <div id="loginForm">
            <!-- Passkey Section (Primary) -->
            <div id="passkeySection">
                <form class="auth-form" id="passkeyForm">
                    <div class="form-group">
                        <label for="emailPasskey">Email Address</label>
                        <input type="email" id="emailPasskey" name="email" required placeholder="your@email.com" autocomplete="username webauthn">
                    </div>

                    <button type="submit" class="passkey-btn" id="passkeyBtn">
                        <span class="passkey-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                        <span id="passkeyBtnText">Sign in with Passkey</span>
                        <span class="loading-spinner" id="passkeySpinner" style="display: none;"></span>
                    </button>
                </form>

                <div class="fallback-link">
                    <a href="#" id="showMagicLinkBtn">Use magic link instead</a>
                </div>
            </div>

            <!-- Magic Link Section (Fallback) -->
            <div id="magicLinkSection">
                <form class="auth-form" id="authForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com">
                    </div>

                    <button type="submit" class="magic-link-btn" id="submitBtn">
                        <span id="btnText"><svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Send Magic Link</span>
                        <span class="loading-spinner" id="loadingSpinner" style="display: none;"></span>
                    </button>
                </form>

                <div class="fallback-link">
                    <a href="#" id="showPasskeyBtn">Use passkey instead</a>
                </div>
            </div>
        </div>

        <div class="email-sent" id="emailSent">
            <h2><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>Check Your Email</h2>
            <p>We've sent a magic link to <strong id="sentEmail"></strong></p>
            <p>Click the link in your email to sign in. The link expires in 15 minutes.</p>
            <button type="button" class="magic-link-btn" id="sendAnotherBtn" style="margin-top: 20px;">
                Send Another Link
            </button>
        </div>

        <div class="back-link">
            <a href="/">← Back to AI Caption Studio</a>
        </div>
    </div>

    <script>
        // Helper to wait for SimpleWebAuthn to load
        async function waitForSimpleWebAuthn() {
            let attempts = 0;
            while (!window.SimpleWebAuthnBrowser && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }
            if (!window.SimpleWebAuthnBrowser) {
                throw new Error('SimpleWebAuthn failed to load');
            }
        }

        class AuthManager {
            constructor() {
                // Form elements
                this.passkeyForm = document.getElementById('passkeyForm');
                this.authForm = document.getElementById('authForm');
                this.emailPasskeyInput = document.getElementById('emailPasskey');
                this.emailInput = document.getElementById('email');

                // Buttons
                this.passkeyBtn = document.getElementById('passkeyBtn');
                this.passkeyBtnText = document.getElementById('passkeyBtnText');
                this.passkeySpinner = document.getElementById('passkeySpinner');
                this.submitBtn = document.getElementById('submitBtn');
                this.btnText = document.getElementById('btnText');
                this.loadingSpinner = document.getElementById('loadingSpinner');
                this.sendAnotherBtn = document.getElementById('sendAnotherBtn');

                // Sections
                this.passkeySection = document.getElementById('passkeySection');
                this.magicLinkSection = document.getElementById('magicLinkSection');
                this.loginForm = document.getElementById('loginForm');
                this.emailSent = document.getElementById('emailSent');

                // Other elements
                this.notification = document.getElementById('notification');
                this.sentEmail = document.getElementById('sentEmail');
                this.headerText = document.getElementById('headerText');

                this.bindEvents();
                this.checkExistingAuth();
                this.init();
            }

            bindEvents() {
                // Passkey form
                this.passkeyForm.addEventListener('submit', this.handlePasskeyLogin.bind(this));

                // Magic link form
                this.authForm.addEventListener('submit', this.handleMagicLinkSubmit.bind(this));
                this.sendAnotherBtn.addEventListener('click', this.showLoginForm.bind(this));

                // Toggle buttons
                document.getElementById('showMagicLinkBtn').addEventListener('click', (e) => {
                    e.preventDefault();
                    this.showMagicLinkForm();
                });

                document.getElementById('showPasskeyBtn').addEventListener('click', (e) => {
                    e.preventDefault();
                    this.showPasskeyForm();
                });
            }

            async init() {
                // Show passkey form by default
                this.showPasskeyForm();

                // Check URL parameters for invite
                const urlParams = new URLSearchParams(window.location.search);
                const inviteToken = urlParams.get('invite');
                const inviteEmail = urlParams.get('email');

                if (inviteToken && inviteEmail) {
                    this.emailInput.value = inviteEmail;
                    this.emailPasskeyInput.value = inviteEmail;
                    this.inviteToken = inviteToken;
                    this.showNotification(`You have been invited! Please sign in to continue.`, 'success');
                }

                // Check registration status
                try {
                    const response = await fetch('/api/auth/registration-status');
                    const data = await response.json();

                    if (!data.registrationOpen && !inviteToken) {
                        this.showNotification(data.message, 'error');
                        this.passkeyBtn.disabled = true;
                        this.submitBtn.disabled = true;
                    }
                } catch (error) {
                    console.error('Failed to check registration status:', error);
                }

                // Check if browser supports WebAuthn
                console.log('🔐 Checking WebAuthn support...');
                console.log('window.PublicKeyCredential:', window.PublicKeyCredential);

                if (!window.PublicKeyCredential) {
                    console.log('❌ WebAuthn not supported, showing magic link by default');
                    this.showMagicLinkForm();
                    this.showNotification('Your browser doesn\'t support passkeys. Using magic link instead.', 'info');
                } else {
                    console.log('✅ WebAuthn is supported, passkey login available');
                }
            }

            checkExistingAuth() {
                const token = localStorage.getItem('auth_token');
                const email = localStorage.getItem('user_email');

                if (token && email) {
                    window.location.href = '/';
                }
            }

            showPasskeyForm() {
                this.passkeySection.style.display = 'block';
                this.magicLinkSection.style.display = 'none';
                this.headerText.textContent = 'Sign in securely';
                this.emailPasskeyInput.focus();
            }

            showMagicLinkForm() {
                this.passkeySection.style.display = 'none';
                this.magicLinkSection.style.display = 'block';
                this.headerText.textContent = 'Sign in with magic link';
                // Copy email if already entered
                if (this.emailPasskeyInput.value) {
                    this.emailInput.value = this.emailPasskeyInput.value;
                }
                this.emailInput.focus();
            }

            async handlePasskeyLogin(e) {
                e.preventDefault();

                const email = this.emailPasskeyInput.value.trim();
                if (!email) {
                    this.showNotification('Please enter your email address', 'error');
                    return;
                }

                this.setPasskeyLoading(true);

                try {
                    // Wait for SimpleWebAuthn to load
                    await waitForSimpleWebAuthn();
                    const { startAuthentication } = window.SimpleWebAuthnBrowser;

                    // Get authentication options from server
                    const optionsResponse = await fetch('/api/auth/passkey/login-options', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });

                    const optionsData = await optionsResponse.json();

                    if (!optionsResponse.ok) {
                        // If no passkeys found, offer to use magic link
                        if (optionsData.error.includes('No passkeys')) {
                            this.showNotification('No passkey found. Use magic link to sign in first.', 'info');
                            setTimeout(() => this.showMagicLinkForm(), 2000);
                            return;
                        }
                        throw new Error(optionsData.error || 'Failed to initiate passkey login');
                    }

                    // Start WebAuthn authentication
                    const credential = await startAuthentication(optionsData.options);

                    // Verify authentication with server
                    const verifyResponse = await fetch('/api/auth/passkey/login-verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            credential,
                            challenge: optionsData.challenge,
                            userId: optionsData.userId
                        })
                    });

                    const verifyData = await verifyResponse.json();

                    if (!verifyResponse.ok) {
                        throw new Error(verifyData.error || 'Passkey verification failed');
                    }

                    // Store auth token
                    localStorage.setItem('auth_token', verifyData.token);
                    localStorage.setItem('user_email', verifyData.user.email);

                    // Success! Redirect to main app
                    this.showNotification('Successfully signed in with passkey!', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);

                } catch (error) {
                    console.error('Passkey login error:', error);
                    if (error.name === 'NotAllowedError') {
                        this.showNotification('Passkey authentication was cancelled', 'error');
                    } else {
                        this.showNotification(error.message || 'Passkey login failed. Try magic link instead.', 'error');
                    }
                } finally {
                    this.setPasskeyLoading(false);
                }
            }

            async handleMagicLinkSubmit(e) {
                e.preventDefault();

                const email = this.emailInput.value.trim();
                if (!email) {
                    this.showNotification('Please enter your email address', 'error');
                    return;
                }

                this.setMagicLinkLoading(true);

                try {
                    const requestBody = { email };
                    if (this.inviteToken) {
                        requestBody.inviteToken = this.inviteToken;
                    }

                    const response = await fetch('/api/auth/request-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });

                    const data = await response.json();

                    if (response.ok) {
                        this.showEmailSent(email);
                    } else {
                        this.showNotification(data.error || 'Failed to send magic link', 'error');
                    }
                } catch (error) {
                    console.error('Auth error:', error);
                    this.showNotification('Network error. Please try again.', 'error');
                } finally {
                    this.setMagicLinkLoading(false);
                }
            }

            setPasskeyLoading(loading) {
                this.passkeyBtn.disabled = loading;
                this.passkeyBtnText.style.display = loading ? 'none' : 'inline';
                this.passkeySpinner.style.display = loading ? 'inline-block' : 'none';
            }

            setMagicLinkLoading(loading) {
                this.submitBtn.disabled = loading;
                this.btnText.style.display = loading ? 'none' : 'inline';
                this.loadingSpinner.style.display = loading ? 'inline-block' : 'none';
            }

            showNotification(message, type) {
                this.notification.textContent = message;
                this.notification.className = `notification ${type}`;
                this.notification.style.display = 'block';

                setTimeout(() => {
                    this.notification.style.display = 'none';
                }, 5000);
            }

            showEmailSent(email) {
                this.sentEmail.textContent = email;
                this.loginForm.style.display = 'none';
                this.emailSent.style.display = 'block';
                this.notification.style.display = 'none';
            }

            showLoginForm() {
                this.loginForm.style.display = 'block';
                this.emailSent.style.display = 'none';
                this.emailInput.value = '';
                this.emailPasskeyInput.value = '';
                this.showPasskeyForm();
            }
        }

        // Initialize auth manager when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new AuthManager();
        });
    </script>
</body>
</html>
